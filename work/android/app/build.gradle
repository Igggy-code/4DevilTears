plugins {
    id 'com.android.application'
}

android {
    namespace = "com.fourdeviltears.app"
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.fourdeviltears.app"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode 8
        versionName "0.8"
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug {
            // Native libraries are prebuilt by build_android.sh (no Gradle CMake).
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
        java.srcDirs += ['src/main/java', 'sdl-java']
    }
    packaging {
        // GPU plugin is dlopen()ed by path from nativeLibraryDir.
        jniLibs { useLegacyPackaging = true }
    }
    lint { abortOnError = false }
}
